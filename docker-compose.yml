# Docker deployment for the agy-gateway: an OpenAI-compatible HTTP gateway
# that spawns the local agy CLI as a subprocess. The gateway NEVER calls any
# API directly (direct API access causes account bans).
#
# AUTH: the container has no OS keyring, so instead of re-authenticating, the
# host's agy login state (~/.gemini) is bind-mounted into the container — the
# OAuth subscription credentials are reused as-is. This is a BIND MOUNT (not a
# named volume) so the existing login survives container rebuilds.
services:
  agy-gateway:
    build: .
    image: agy-gateway:latest
    ports:
      - "8787:8787"
    environment:
      # Optional: a Gemini API key (with "modelProvider": "gemini" in the
      # mounted settings.json) is an alternative headless auth path, but the
      # default is the bind-mounted OAuth login — no key needed.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Optional: when set, the gateway requires Authorization: Bearer <token>.
      AGY_GATEWAY_TOKEN: ${AGY_GATEWAY_TOKEN:-}
      # Optional passthrough of the gateway tuning knobs (see README).
      AGY_GATEWAY_MAX_QUEUE: ${AGY_GATEWAY_MAX_QUEUE:-8}
      AGY_GATEWAY_TIMEOUT_S: ${AGY_GATEWAY_TIMEOUT_S:-300}
      AGY_GATEWAY_MODELS_TTL_S: ${AGY_GATEWAY_MODELS_TTL_S:-3600}
      # Bridge agy tool steps to host tool names and emit them as tool_calls;
      # set to 0/false to emit only model text.
      AGY_GATEWAY_STREAM_STEPS: ${AGY_GATEWAY_STREAM_STEPS:-1}
      # Host path of the directory bind-mounted at /workspace. The gateway uses
      # it to rewrite container paths (/workspace/...) to host paths in bridged
      # tool calls, so the host executes against the real project.
      AGY_GATEWAY_WORKSPACE: ${AGY_GATEWAY_WORKSPACE:-${PWD:-.}/workspace}
      # Proxy passthrough: agy's eligibility check and model requests need to
      # reach Google; behind GFW-style networks the container MUST inherit the
      # host proxy (docker containers do NOT get it automatically). The
      # entrypoint rewrites loopback (127.0.0.1/localhost) to
      # host.docker.internal — inside the container 127.0.0.1 is the container
      # itself, not the host.
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
    extra_hosts:
      # Resolve host.docker.internal to the host's gateway IP (macOS/Windows
      # Docker Desktop provides this automatically; explicit for Linux).
      - "host.docker.internal:host-gateway"
    volumes:
      # Host agy login state (OAuth credentials, settings, caches) — the
      # container reuses the host subscription, so `agy login` is never needed.
      - ${HOME:-~}/.gemini:/root/.gemini
      # agy agent-mode (accept-edits) working directory — what agy may modify.
      # Defaults to a dedicated ./workspace dir; set AGY_GATEWAY_WORKSPACE to
      # bind-mount the host project itself (e.g. $PWD) for bridged reads.
      - ${AGY_GATEWAY_WORKSPACE:-${PWD:-.}/workspace}:/workspace
    restart: unless-stopped
