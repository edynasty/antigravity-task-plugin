name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Install opencode CLI (integration harness)
        run: npm install -g opencode-ai@1.18.16

      - name: Isolated integration harness
        run: bun run test:integration

      - name: Pack inspection
        run: npm pack --dry-run --json

      - name: Credential scan (source/config/test only)
        run: |
          set -euo pipefail
          if grep -rnE \
            "AKIA[0-9A-Z]{16}|ghp_[0-9A-Za-z]{36}|github_pat_[0-9A-Za-z_]{20,}|AIza[0-9A-Za-z_\-]{35}|xox[baprs]-[0-9A-Za-z-]{10,}|sk-[A-Za-z0-9]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY-----" \
            src tests package.json tsconfig.json tsconfig.build.json .github .gitignore 2>/dev/null; then
            echo "::error::credential-like pattern found in repository source/config/test"
            exit 1
          fi
          echo "credential scan clean"

      - name: Static scan (forbidden patterns in src/tests)
        run: |
          set -euo pipefail
          if grep -rnE ": any\b|as any|as unknown|@ts-ignore|@ts-expect-error" src tests 2>/dev/null; then
            echo "::error::forbidden type pattern found in src/tests"
            exit 1
          fi
          echo "static scan clean"
